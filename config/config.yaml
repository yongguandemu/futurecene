# ============================================================
# 配置模板（提交 Git）—— 所有密钥用 ${{ env.XXX }} 占位符
# 真实值存放于 .env（不提交，规格书 6.2 密钥管理规则）
# ConfigLoader 启动时解析占位符；环境变量缺失即报错退出
# ============================================================

llm:
  # 引擎路由（ADR-006 成本控制）：payload.engine 决定降级链
  # - "fast"（日常对话/弹幕/主动话题）：zhipu(GLM-4.7-FlashX) 优先 → openai 兜底
  # - "pro"/缺省（复杂 Agent：游戏操作规划等）：openai(DeepSeek V4 Pro) 优先 → zhipu 兜底
  openai:
    api_key: ${{ env.OPENAI_API_KEY }}      # DeepSeek V4 Pro（pro 引擎主力，Agent 复杂任务）
    base_url: ${{ env.OPENAI_BASE_URL }}    # https://api.deepseek.com/v1
    model: ${{ env.OPENAI_MODEL }}          # deepseek-v4-pro
  zhipu:
    api_key: ${{ env.ZHIPU_API_KEY }}       # 智谱 API Key（fast 引擎主力，日常对话/弹幕互动）
    model: ${{ env.ZHIPU_MODEL }}           # glm-4.7-flashx（轻量高速版，付费保吞吐，与 .env 保持一致）
  active_dialogue:
    enabled: false        # 主动对话总开关（默认开）。开着会定时调 LLM+TTS，消耗积分，测试期建议关闭。

tts:
  # 本机播放：TTS 合成后直接在本机扬声器播放（无前端浏览器/直播测试台场景）。
  # 前端（live2d_stream）打开时会与浏览器播放叠加，OBS 正式直播建议关闭。
  local_playback: true
  primary_engine: wusound
  fallback_chain: [wusound, cosyvoice]
  wusound:
    api_key: ${{ env.WUSOUND_API_KEY }}       # 悟声 API Key（主引擎）
    voice_id: a8df9796-da14-49b0-8db0-c0d141d3b164   # Yuki 悟声音色（非密钥）
    voice_id_lilith: a4dbb2a9-48cd-4853-85c5-24f07b354acf
    preset: balance
    language: auto
    flash: false
    vivid: false
    break_clone: true
    timeout: 30
  dashscope:
    api_key: ${{ env.DASHSCOPE_API_KEY }}     # DashScope API Key（降级备选）
    model: cosyvoice-v3.5-plus
    voice_id: cosyvoice-v3.5-plus-vd-yuki-12276cf381b94a93b1ac81743b86ada2

bilibili:
  access_key_id: ${{ env.BILIBILI_ACCESS_KEY_ID }}      # 开放平台 AccessKey ID
  access_key_secret: ${{ env.BILIBILI_ACCESS_KEY_SECRET }}  # AccessKey Secret
  cookie: ${{ env.BILIBILI_COOKIE }}        # 登录 Cookie

obs:
  ws_password: ${{ env.OBS_WS_PASSWORD }}   # OBS WebSocket 密码

# ---------- P2 扩展配置 ----------

music:
  default_volume: 0.8        # 默认音量（0~1）
  ffplay_path: ""            # ffplay 可执行文件路径（留空自动探测）

platform:
  qq:
    # QQ 开放平台机器人凭证（非密钥占位；接入时填入真实值）
    bot_appid: ""
    secret: ""
  obs:
    host: 127.0.0.1
    port: 4455
    password: ${{ env.OBS_WS_PASSWORD }}   # 复用 OBS WebSocket 密码
  vts:
    host: 127.0.0.1
    port: 8001
    plugin_name: FutureScene
    plugin_dev: FutureScene

stream:
  enabled: false             # 是否随启动启用无人值守直播编排
  room_id: 0                 # B站 直播间房间号（0=模拟模式）
  identity_code: ""          # B站 分房间推流 identity_code（非密钥）
  page_url: http://127.0.0.1:8000/live2d-stream.html?paused=0
  width: 1280
  height: 720
  fps: 12
  bitrate: "800k"
  # ---- 推流目标：二选一 ----
  # A. 手动推流码（推荐：无直播间/无 Cookie 也能推）：开播前从 B站开播页复制
  #    RTMP 地址 + 推流码填入，start 时优先使用；留空则走 B 自动刷新。
  #    rtmp_key 为敏感信息，建议用环境变量 STREAM_RTMP_KEY（config_loader 支持 ${{ env.XXX }}）。
  rtmp_server: ""            # 如 rtmp://live-send.bilivideo.com/live-bvc
  rtmp_key: ""               # 推流码（敏感，勿提交；可用 ${{ env.STREAM_RTMP_KEY }}）
  # B. 自动刷新：room_id + identity_code + deploy/bilibili_cookie.json（B站 Cookie）
  #    → startLive API 自动获取最新推流地址（需已开通直播间）。
  # ---- 内容源（source_type） ----
  # live2d：无头渲染 live2d_stream 页面逐帧推流（默认，Live2D 实时互动）
  # video ：预设视频循环推流（挂机内容，source_path 指向视频文件）
  # image ：静态图循环推流（封面/待机画面，source_path 指向图片）
  source_type: live2d
  source_path: ""            # video/image 模式的源文件（如 data/clips/loop.mp4）

experience:
  enabled: true              # 是否随启动启用经验学习调度官
  game: minecraft            # 默认游戏（混合知识库按游戏隔离）
  data_file: data/experience.json
  min_confidence: 0.7        # 经验复用阈值
  query_top_k: 3             # 检索返回数
  max_entries: 5000          # 经验上限

# ---------- 世界书（P0 迁移 470 条 + 自动进化） ----------
world_book:
  evolve:
    enabled: true            # 订阅弹幕/礼物事件自动进化世界书（装配层启动）
    topic_threshold: 10      # 话题出现次数 ≥ 该值 → 生成观众话题条目
    viewer_gift_value: 100   # 观众累计礼物价值（金瓜子）≥ 该值 → 重要观众条目
    viewer_msg_count: 20     # 观众发言数 ≥ 该值 → 常驻观众条目

# ---------- 日程排期（P0 补迁：到点触发动作，经指挥官分发） ----------
schedule:
  enabled: true              # 调度总开关（关闭则检查线程不启动）
  data_file: data/schedule.json   # 运行时增删的排期落盘位置
  # 预置排期：cron 为 5 段表达式（分 时 日 月 周），支持 * / */n / a-b / a,b,c / 数字
  # action 为要触发的能力名（如 stream:start / live2d:expression），payload 随事件透传
  jobs: []

# ---------- P1 直播间智能（精细子模块）配置 ----------
intelligence:
  commentary_style: 陪看吐槽型    # VN 解说风格
  commentary_max_words: 40        # 解说最大字数
  min_commentary_interval: 20.0   # 解说最小间隔（秒）
  dialogue_quiet_seconds: 8.0     # 对白静默允许解说阈值（秒）
  pool_max_size: 100              # 弹幕池容量
  pool_ttl: 600.0                 # 弹幕存活时长（秒）
  reactor_global_cooldown: 1.0    # 反应器全局冷却（秒）
  reactor_rate_max: 20            # 反应器速率上限（次/分钟）
  heat_decay_per_sec: 0.02        # 热度时间衰减
  heat_event_decay: 0.95          # 热度事件衰减
  speech_max_size: 200            # 发言队列容量
  speech_timeout: 120.0           # 发言超时（秒）
  context_cache_ttl: 0.5          # 情境快照缓存 TTL（秒）

# ---------- 游戏实况（P3 通用游戏操作）配置 ----------
game:
  operation:
    poll_interval: 2.0           # 感知轮询间隔（秒）
    advance_wait: 4.0            # 对白停顿后推进等待（秒）
    max_failures: 5              # 连续失败自动停止上限
    fuse_limit: 3                # 连续无响应熔断阈值
    fuse_pause: 60               # 熔断暂停时长（秒）
    post_action_cooldown: 3.0    # 操作后冷却（秒）
    dedup_window: 8              # 同指令去重窗口（秒）
    retry_limit: 2               # 操作失败/无变化重试上限
    image_diff_threshold: 0.02   # 图像差分变化判定阈值（像素占比）

# ---------- 多角色协作（P2 装配，P1 先备好角色映射） ----------
# 初值说明：
# - enabled: 总开关（默认关）。开启方式：本项改 true，或环境变量 COLLAB_ENABLED=1（环境变量优先）。
# - rules_order: 发言权仲裁规则链（按序命中即放行），5 个内置规则全部零 LLM、确定性文本规则：
#   mention（@指定角色，硬放行）→ intent（!/命令等系统意图 → lead_role）→
#   relevance（关键词加权，profiles 的 patterns/topics/personality）→
#   cooldown（闲置最久者优先）→ random（平局随机兜底）。
# - lead_role: 系统意图归属角色（不独占发言权，仅影响 intent 规则；change 后重启回落本初值）。
# - trigger_probability: 一角色发言完成后对方接话（banter）概率，0~1；0 关闭联动接话。
# - trigger_global_cooldown: 联动接话全局冷却（秒），防连续接话刷屏。
# - awareness: 感知彼此——为发言角色注入对方最近发言（max_partner_lines 条）。
collaboration:
  enabled: false
  # 规则链（V2 加入结构规则）：mention(@指定) > intent(系统意图→lead) >
  # continuation(观众回应上一位发言者) > relevance(话题相关) >
  # balance(防垄断换人) > cooldown(闲置最久) > random(平局兜底)
  rules_order: [mention, intent, continuation, relevance, balance, cooldown, random]
  balance:
    max_run: 2          # 防垄断：同角色连续发言超过该值且无更强信号时换人
  judge: rules          # 发言权判断器：rules（规则链，默认）| llm（LLM 紧迫度，V3）
  llm_judge:
    budget_per_min: 4   # LLM 判断预算：每分钟最多调用次数；超预算自动回退规则链
  lead_role: yuki
  trigger_probability: 0.3
  trigger_global_cooldown: 20.0
  awareness:
    enabled: true
    max_partner_lines: 2

roles:
  - name: yuki
    live2d_model: Hiyori
    restrict_breath: true
    idle_silent_motion: Hiyori_m03
    position: {x: 0.27, y: 1.0}
    scale: 0.42
    expression_map: {}
    motion_map:
      wave: Hiyori_m01
      nod: Hiyori_m02
      shake: Hiyori_m05
      idle: Hiyori_m01
  - name: lilith
    live2d_model: Haru
    restrict_breath: false
    position: {x: 0.73, y: 1.0}
    scale: 0.42
    expression_map: {开心: 唱歌, 难过: 流泪, 惊讶: 头发, 害羞: 嘟嘴, 生气: 脸黑, 平静: 头发}
    motion_map: {wave: wave, nod: nod, shake: shake, idle: idle}
