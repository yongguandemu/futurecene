<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>弹幕输入源（OBS 透明）</title>
<style>
  /* OBS 浏览器源：仅渲染弹幕输入框，背景透明，供 OBS 独立组合 */
  html, body {
    margin: 0; padding: 0;
    background: transparent !important;
    overflow: hidden;
    width: 100%; height: 100vh;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #danmu-input-bar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 3; width: 420px; max-width: 60vw;
  }
  #danmu-input-bar input {
    flex: 1; padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(180,160,200,0.4);
    background: rgba(255,255,255,0.8); color: #333; font-size: 13px; outline: none;
    backdrop-filter: blur(4px);
  }
  #danmu-input-bar input::placeholder { color: rgba(100,80,120,0.5); }
  #danmuSend {
    padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #d87093, #9b6dd9); color: #fff; font-weight: 600;
    font-size: 13px;
  }
  #danmuSend:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div id="danmu-input-bar">
    <input id="danmuInput" type="text" placeholder="输入测试弹幕，回车发送…">
    <button id="danmuSend">发送弹幕</button>
  </div>

  <script>
  (function () {
    "use strict";
    var input = document.getElementById("danmuInput");
    var send = document.getElementById("danmuSend");
    function postDm(text) {
      fetch("/api/danmaku", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: text, user_name: "测试观众" })
      }).then(function (r) { return r.json(); }).catch(function () { /* 网络错误静默 */ });
    }
    function onSend() {
      var t = input.value.trim();
      if (!t) return;
      postDm(t);
      input.value = "";
    }
    send.addEventListener("click", onSend);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); onSend(); }
    });
  })();
  </script>
</body>
</html>
