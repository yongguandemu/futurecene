<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Live2D 直播源</title>
<script src="/frontend/assets/store.js"></script>
<script src="/frontend/assets/state_sync.js"></script>
<style>
  /* 默认：杂谈直播间背景；?transparent=1 时透明（OBS 浏览器源） */
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a2e;
    overflow: hidden;
    width: 100%;
    height: 100vh;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  body.has-bg {
    background: url('/assets/streaming/zatsudan_bg.png') center center / cover no-repeat #1a1a2e;
  }
  body.transparent-mode {
    background: transparent !important;
  }
  #canvas-holder {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 560px;
    height: 720px;
    pointer-events: none;
    z-index: 2;
  }
  #hint {
    position: fixed;
    top: 12px;
    left: 12px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 8px;
    padding: 6px 12px;
    display: none;
    z-index: 4;
  }
  /* M2 说话高亮：仲裁放行（speech:arbitrated）→ 模型容器加聚光边框；发言完成移除 */
  #canvas-holder.actor-speaking {
    border: 2px solid rgba(255, 196, 118, 0.7);
    border-radius: 16px;
    box-shadow: 0 0 26px rgba(255, 176, 64, 0.55),
                inset 0 0 20px rgba(255, 200, 130, 0.10);
  }

  /* ===== 弹幕显示框：叠加在背景右侧 COMMENT 区域 ===== */
  #danmu-panel {
    position: fixed; right: 3%; top: 18%; width: 22%; max-width: 340px; max-height: 55vh;
    overflow-y: auto; z-index: 3; background: rgba(255, 255, 255, 0.75);
    border-radius: 10px; padding: 10px; display: flex; flex-direction: column-reverse;
    font-size: 13px; backdrop-filter: blur(4px);
    border: 1px solid rgba(200, 160, 220, 0.4);
  }
  #danmu-panel::-webkit-scrollbar { width: 4px; }
  #danmu-panel::-webkit-scrollbar-thumb { background: rgba(180, 140, 200, 0.3); border-radius: 2px; }
  #danmu-list .dm-item { color: #333; margin: 4px 0; word-break: break-all; line-height: 1.5; }
  #danmu-list .dm-item .dm-user { color: #c06090; margin-right: 6px; font-weight: 600; }
  #danmu-list .dm-item.ai { color: #4060b0; }
  #danmu-list .dm-item.filtered { color: #c44; text-decoration: line-through; }

  /* ===== 弹幕输入框：叠加在底部控制栏 ===== */
  #danmu-input-bar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 3; width: 420px; max-width: 60vw;
  }
  #danmu-input-bar input {
    flex: 1; padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(180, 160, 200, 0.4);
    background: rgba(255, 255, 255, 0.8); color: #333; font-size: 13px; outline: none;
    backdrop-filter: blur(4px);
  }
  #danmu-input-bar input::placeholder { color: rgba(100, 80, 120, 0.5); }
  #danmuSend {
    padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #d87093, #9b6dd9); color: #fff; font-weight: 600;
    font-size: 13px;
  }
  #danmuSend:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div id="hint">模型加载中…</div>
  <div id="canvas-holder"></div>

  <!-- 弹幕显示框（测试用） -->
  <div id="danmu-panel">
    <div id="danmu-list"></div>
  </div>

  <!-- 直播测试台：弹幕输入框（测试用） -->
  <div id="danmu-input-bar">
    <input id="danmuInput" type="text" placeholder="输入测试弹幕，回车发送…">
    <button id="danmuSend">发送弹幕</button>
  </div>

  <!-- 本地 vendor：PixiJS + Live2D Cubism（离线可用，规格书 12.1；/frontend/ 由 Flask 静态路由服务） -->
  <!-- process shim：pixi-live2d-display 内部引用 process.env.NODE_ENV（Node 全局），浏览器无此对象会抛
       ReferenceError 导致 Live2DModel 未定义、模型不渲染；此处先注入生产环境 shim。 -->
  <script>window.process = window.process || { env: { NODE_ENV: "production" } };</script>
  <!-- 加载顺序：Cubism2 runtime(live2d.min.js) → Cubism4 core(live2dcubismcore.min.js) → PixiJS → pixi-live2d-display。
       pixi-live2d-display 初始化会同时检查 Live2D(Cubism2) 与 Live2DCubismCore(Cubism4)，缺任一即抛
       "Could not find Cubism 2 runtime" 且模型不渲染（.moc3 模型也依赖 Cubism2 runtime 存在）。 -->
  <script src="/frontend/vendor/live2d.min.js"></script>
  <script src="/frontend/vendor/live2dcubismcore.min.js"></script>
  <!-- Memory shim：当前 live2dcubismcore.min.js 缺 Live2DCubismCore.Memory 命名空间，
       pixi-live2d-display 的 CubismFramework.initialize() 依赖 Memory.initializeAmountOfMemory，
       缺失会导致"最先加载的模型"（如 yuki/Hiyori）触发 Cubism4 初始化失败、模型不渲染；
       Haru 因排在后面走 isStarted 捷径绕过不报错。Memory.initializeAmountOfMemory 仅预分配内存，
       moc3 加载走 _csm/Moc 原生函数不依赖它，no-op 兼容即可（Haru 全量渲染已验证）。 -->
  <script>
    if (typeof Live2DCubismCore !== 'undefined' && !Live2DCubismCore.Memory) {
      Live2DCubismCore.Memory = { initializeAmountOfMemory: function () {} };
    }
  </script>
  <script src="/frontend/vendor/pixi.min.js"></script>
  <script src="/frontend/vendor/pixi-live2d-display.min.js"></script>
  <!-- 连续动画驱动库：30Hz 参数注入，接管呼吸/视线/情绪混合/说话微动/空闲行为 -->
  <script src="/frontend/assets/live2d_driver.js"></script>
  <!-- 角色加载与事件驱动核心（与 /live2d/live2d.html 复用；本页同时含弹幕显示/输入，供本地组合预览） -->
  <script src="/frontend/live2d_stream/live2d_actor.js"></script>

<script>
// 背景模式：默认显示杂谈背景；?transparent=1 为 OBS 透明模式
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('transparent') === '1') {
    document.body.classList.add('transparent-mode');
  } else {
    document.body.classList.add('has-bg');
  }
})();
</script>
</body>
</html>
