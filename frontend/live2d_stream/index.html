<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Live2D 直播源</title>
<script src="/frontend/assets/store.js"></script>
<script src="/frontend/assets/state_sync.js"></script>
<style>
  /* OBS 浏览器源：透明背景 */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent !important;
    overflow: hidden;
    width: 100%;
    height: 100vh;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #canvas-holder {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 560px;
    height: 720px;
    pointer-events: none;
  }
  #hint {
    position: fixed;
    top: 12px;
    left: 12px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 8px;
    padding: 6px 12px;
    display: none;
  }
</style>
</head>
<body>
  <div id="hint">模型加载中…</div>
  <div id="canvas-holder"></div>

  <!-- 本地 vendor：PixiJS + Live2D Cubism（离线可用，规格书 12.1；/frontend/ 由 Flask 静态路由服务） -->
  <script src="/frontend/vendor/pixi.min.js"></script>
  <script src="/frontend/vendor/pixi-live2d-display.min.js"></script>
  <script src="/frontend/vendor/live2dcubismcore.min.js"></script>

<script>
(function () {
  "use strict";

  var MODEL_URL = "/assets/live2d/小恶魔/小恶魔.model3.json"; // 由 app_factory /assets/ 静态路由服务
  var hint = document.getElementById("hint");

  function showHint(text) {
    hint.textContent = text;
    hint.style.display = "block";
  }

  // Live2D 口型同步：监听 tts:audio_ready（表达领域协作，规格书 3.4，保留现有功能）
  var mouthOpen = 0;

  function setMouth(open) {
    mouthOpen = open ? 0.9 : 0;
    if (window.__app && window.__app.model) {
      try {
        window.__app.model.internalModel.motionManager
          .update(0, 0);
      } catch (e) { /* ignore */ }
    }
  }

  // ---- store 事件处理（数据源统一，只订阅 live2d:/audio:/tts:） ----
  // live2d:motion_triggered → 触发动作（motion 为动作名）
  function triggerMotion(name) {
    if (!window.__app || !window.__app.model || !name) return;
    try { window.__app.model.motion(name); } catch (e) { /* ignore */ }
  }
  // live2d:expression_changed → 切换表情（expression 为表情 id/名）
  function setExpression(name) {
    if (!window.__app || !window.__app.model || !name) return;
    try { window.__app.model.expression(name); } catch (e) { /* ignore */ }
  }
  // audio:segment_ready → 音频分片就绪：触发一段口型动画（音频播放由 /ws/tts_audio 通道提供）
  function playSegment(audioId) {
    if (window.__app && window.__app.model) {
      setMouth(true);
      setTimeout(function () { setMouth(false); }, 1500);
    }
  }

  async function boot() {
    if (!window.PIXI || !window.PIXI.live2d) {
      showHint("PixiJS / Live2D 库加载失败，请检查网络（OBS 需可访问 CDN）");
      return;
    }
    var app = new PIXI.Application({
      view: document.createElement("canvas"),
      transparent: true,
      autoStart: true,
      width: 560,
      height: 720,
      antialias: true,
    });
    var holder = document.getElementById("canvas-holder");
    holder.appendChild(app.view);
    window.__app = app;

    try {
      var model = await PIXI.live2d.Live2DModel.from(MODEL_URL);
      model.anchor.set(0.5, 1.0);
      model.scale.set(0.42);
      model.x = app.screen.width / 2;
      model.y = app.screen.height;
      app.stage.addChild(model);
      window.__app.model = model;
      showHint("");
      hint.style.display = "none";
    } catch (e) {
      showHint("模型未就绪：" + MODEL_URL + "（模型文件迁移后自动加载）");
      // 模型缺失时保持透明画布，不阻塞 OBS 使用
    }

    // 单一 store + WS 同步：口型/表情/动作由后端事件驱动（断线自动重连补数）
    var store = FSStore.createStore(FSStore.makeReducer(), FSStore.initialState());
    var sync = new FSStateSync(store);
    sync.init();

    store.subscribe("live2d:", function (state, event) {
      if (event.type === "live2d:motion_triggered") triggerMotion(event.motion);
      if (event.type === "live2d:expression_changed") setExpression(event.expression);
    });
    store.subscribe("audio:", function (state, event) {
      if (event.type === "audio:segment_ready") playSegment(event.audio_id);
    });
    store.subscribe("tts:", function (state, event) {
      if (event.type === "tts:audio_ready") {
        setMouth(true);
        setTimeout(function () { setMouth(false); }, event.duration_ms || 1500);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
