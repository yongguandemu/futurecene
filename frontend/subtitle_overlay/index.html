<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>字幕叠加源 - Subtitle Overlay（OBS 透明）</title>
<script src="/frontend/assets/store.js"></script>
<script src="/frontend/assets/state_sync.js"></script>
<style>
  /* OBS 浏览器源：透明背景，仅渲染字幕叠加层 */
  html, body {
    margin: 0; padding: 0;
    background: transparent !important;
    overflow: hidden;
    width: 100%; height: 100vh;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
</style>
</head>
<body>
  <!-- 时序：frontend:subtitle_update 缓存 → tts:audio_ready(TTS开始播放) 显示 → speech:completed 隐藏。
       字幕卡样式与定位由 subtitle.js 自注入，默认定位于视图垂直中部(人物中部)。 -->
  <script src="/frontend/live2d_stream/subtitle.js"></script>
  <script>
    if (window.SubtitleOverlay) {
      new window.SubtitleOverlay({ top: 58,
        roleNames: { yuki: "Yuki", lilith: "Lilith" } }).attach();
    }
  </script>
</body>
</html>
